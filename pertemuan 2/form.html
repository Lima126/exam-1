<body style="background-color: aqua; padding: 4em;">

    <p>random</p>
    <header>
        <nav>

    </header>

    <main>
        <h1>html form</h1>

        <form action="#" method="get">
            <!-- nama -->
            <div>
                <label for="namalengkap">nama lengkap</label>
                <input type="text" name="namalengkap" id="namalengkap">
            </div>
            <!-- umur -->
            <div>
                <label for="umur">umur</label>
                <input type="number" name="umur" id="umur">
            </div>
            <!-- email -->
            <div>
                <label for="email">email</label>
                <input type="email" name="email" id="email">
            </div>
            <!-- gender -->
            <div>
                <label for="gender">gender</label>

                <div>
                    <input type="radio" name="gender" id="laki" value="laki">
                    <label for="laki">laki</label>
                </div>
                <div>
                    <input type="radio" name="gender" id="perempuan" value="perempuan">
                    <label for="perempuan">perempuan</label>
                </div>
                <div>
                    <input type="radio" name="gender" id="other" value="other">
                    <label for="other">other</label>
                </div>
            </div>
            <!-- setuju -->
            <div>
                <input type="checkbox" name="agree" id="agree" required>
                <label for="agree">yakin?</label>
            </div>

            <!-- select/dropdown -->
            <div>
                <select name="pendidikan" id="belajar">
                    <option value="sd">sd</option>
                    <option value="smp">smp</option>
                    <option value="sma">sma</option>
                    <option value="kuliah">kuliah</option>
                </select>
            </div>

            <!-- submit -->
            <button type="submit">simpan data</button>
        </form>
    </main>

    <footer>

        <h1>contact me</h1>
        <ul>
            <li>email: something2@gmail.com</li>
        </ul>
        <p>yea</p>
    </footer>

</body>
