<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>belajar CSS layouting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <header>
        <div class="brand">
            <h1>SumSumMart</h1>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="#hero">Home</a>
                </li>
                <li>
                    <a href="#products">Products</a>
                </li>
                <li>
                    <a href="#contacts">Contacts</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="hero">

            <div class="hero-cta">
                <h2>Get your own gun today, with some goodies!!!</h2>

                <div>
                    <button>Buy Now!</button>
                </div>

            </div>

            <div class="hero-image">
                <img src="./asset/gun store.png" alt="gun store">
            </div>

        </section>

        <section id="products">
            <h1>Weapon Lists</h1>

            <div class="product-list">
                <div class="product-card">

                    <img src="./asset/m4.png" alt="gun">
                    <h3>m4</h3>
                    <h4>rp50.000.000</h4>
                    <div>
                        <button>Buy Now!!!</button>
                    </div>

                </div>

                <div class="product-card">

                    <img src="./asset/desert eagle.png" alt="gun">
                    <h3>desert eagle</h3>
                    <h4>rp30.000.000</h4>
                    <div>
                        <button>Buy Now!!!</button>
                    </div>

                </div>

                <div class="product-card">

                    <img src="./asset/m1 carbine.png" alt="gun">
                    <h3>m1 carbine</h3>
                    <h4>rp80.000.000</h4>
                    <div>
                        <button>Buy Now!!!</button>
                    </div>

                </div>
            </div>
        </section>

        <section id="Contacts">

        </section>
    </main>

    <footer>

    </footer>

</body>

</html>
